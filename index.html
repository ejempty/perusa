<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perusa</title>
<style>
  :root { --bg: #fbfbfc; --ink: #1c2530; --muted: #5a6875; --accent: #0891b2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12181e; --ink: #e2e8ee; --muted: #93a1ad; --accent: #22d3ee; }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font: 17px/1.6 system-ui, sans-serif;
    min-height: 100vh; display: grid; place-items: center; padding: 2rem;
  }
  main { text-align: center; max-width: 26rem; }
  h1 { font-size: 1.6rem; margin: 1rem 0 .5rem; }
  p { color: var(--muted); margin-bottom: 1.5rem; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <svg width="72" height="72" viewBox="0 0 108 108" aria-hidden="true">
    <rect width="108" height="108" rx="24" fill="#0F2931"/>
    <circle cx="54" cy="54" r="22.4" fill="none" stroke="#E8F4F8" stroke-width="4"/>
    <circle cx="60.7" cy="48.4" r="6.7" fill="#7FD4E8"/>
  </svg>
  <h1>Perusa</h1>
  <p>Motion-sickness relief for reading in a moving vehicle. Coming to Google&nbsp;Play.</p>
  <p><a href="privacy-policy/">Privacy policy</a></p>
</main>
</body>
</html>
